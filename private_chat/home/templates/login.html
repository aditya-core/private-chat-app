<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THETA | Classified Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* glossy background with subtle grid */
        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(20, 20, 20, 0.95) 0%, #000000 80%),
                repeating-linear-gradient(0deg, rgba(255, 215, 0, 0.02) 0px, rgba(255, 215, 0, 0.02) 1px, transparent 1px, transparent 3px);
            z-index: 0;
        }

        /* particle canvas */
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* main terminal window */
        .terminal-window {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 650px;
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 24px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(255, 215, 0, 0.05);
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* THETA logo */
        .logo {
            font-size: 3.2rem;
            font-weight: 900;
            font-family: 'Segoe UI', 'Arial Black', sans-serif;
            color: #b0b0b0;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.2);
            letter-spacing: 8px;
            margin-bottom: 2rem;
            user-select: none;
            animation: logoGlow 3s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            from { text-shadow: 0 0 12px rgba(255, 215, 0, 0.4), 0 0 30px rgba(255, 215, 0, 0.15); }
            to { text-shadow: 0 0 18px rgba(255, 215, 0, 0.8), 0 0 50px rgba(255, 215, 0, 0.3); }
        }

        /* typing area */
        #typing-area {
            color: #c8c8c8;
            font-size: 1.2rem;
            line-height: 1.8;
            min-height: 4em;
            text-align: center;
            margin-bottom: 1.5rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .typing-text {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid #ffd700;
            animation: blinkCursor 0.8s step-end infinite;
        }

        @keyframes blinkCursor {
            50% { border-color: transparent; }
        }

        /* input fields – hidden by default */
        .input-group {
            width: 100%;
            display: none;
            margin-bottom: 1.2rem;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .input-group.active {
            display: block;
            opacity: 1;
        }

        .input-group input {
            width: 100%;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 0.9rem 1.2rem;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        /* captcha text */
        #captcha-question {
            color: #aaaaaa;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        /* submit button */
        #submit-btn {
            display: none;
            background: transparent;
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 0.8rem 2.5rem;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
            opacity: 0;
        }

        #submit-btn.active {
            display: inline-block;
            opacity: 1;
            animation: fadeIn 0.5s ease;
        }

        #submit-btn:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* MODAL OVERLAY */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            animation: modalPop 0.4s ease;
        }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-box.success {
            border-color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        .modal-box.denied {
            border-color: #ff3333;
            box-shadow: 0 0 30px rgba(255, 50, 50, 0.5);
            animation: shake 0.5s ease;
        }

        .modal-box.denied .modal-close {
            color: #ff3333;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .modal-title {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
        }

        .modal-title.green { color: #00ff88; }
        .modal-title.red { color: #ff3333; }

        .modal-message {
            color: #cccccc;
            font-family: 'Courier New', monospace;
            margin-bottom: 1.5rem;
        }

        .modal-close {
            background: transparent;
            border: 1px solid currentColor;
            color: inherit;
            padding: 0.5rem 2rem;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }

        /* red flash alert */
        .red-alert-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.15);
            z-index: 99;
            pointer-events: none;
            animation: flashRed 0.3s ease-out;
        }

        @keyframes flashRed {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* CRT scanline overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.03) 2px,
                    rgba(0, 0, 0, 0.03) 4px);
            pointer-events: none;
            z-index: 150;
        }
    </style>
</head>
<body>

    <!-- Background layer -->
    <div id="bg-overlay"></div>
    <canvas id="particles-js"></canvas>

    <!-- Terminal Window -->
    <div class="terminal-window">
        <div class="logo">THETA</div>

        <div id="typing-area">
            <span id="typing-text" class="typing-text"></span>
        </div>

        <!-- Inputs (hidden initially) -->
        <div class="input-group" id="name-group">
            <input type="text" id="name-input" placeholder="Enter your name..." autocomplete="off">
        </div>
        <div class="input-group" id="code-group">
            <input type="password" id="code-input" placeholder="Enter secret code..." autocomplete="off">
        </div>
        <div class="input-group" id="captcha-group">
            <div id="captcha-question"></div>
            <input type="text" id="captcha-input" placeholder="Captcha answer..." autocomplete="off">
        </div>

        <button id="submit-btn">AUTHENTICATE</button>
    </div>

    <!-- Modal for success / failure -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box" id="modal-box">
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-message" id="modal-message"></div>
            <button class="modal-close" id="modal-close">CLOSE</button>
        </div>
    </div>

    <script>
        (function() {
            // ──────────────────────────────────────
            // CONFIG (hardcoded secret – replace later)
            const SECRET_CODE = "THETA-ACCESS-123"; // you will change this

            // ──────────────────────────────────────
            // DOM ELEMENTS
            const typingText = document.getElementById('typing-text');
            const nameGroup = document.getElementById('name-group');
            const codeGroup = document.getElementById('code-group');
            const captchaGroup = document.getElementById('captcha-group');
            const nameInput = document.getElementById('name-input');
            const codeInput = document.getElementById('code-input');
            const captchaInput = document.getElementById('captcha-input');
            const captchaQuestion = document.getElementById('captcha-question');
            const submitBtn = document.getElementById('submit-btn');
            const modalOverlay = document.getElementById('modal-overlay');
            const modalBox = document.getElementById('modal-box');
            const modalTitle = document.getElementById('modal-title');
            const modalMessage = document.getElementById('modal-message');
            const modalClose = document.getElementById('modal-close');

            // State machine
            let step = 0; // 0: typing name prompt, 1: name entered, 2: code prompt, 3: code entered, 4: captcha prompt, 5: ready
            let captchaAnswer = 0;
            let userName = '';

            // ──────────────────────────────────────
            // PARTICLES BACKGROUND (simple canvas)
            const canvas = document.getElementById('particles-js');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particlesArray = [];

            function initParticles() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                particlesArray = [];
                const count = 120;
                for (let i = 0; i < count; i++) {
                    particlesArray.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        size: Math.random() * 1.5 + 0.5,
                        speedX: (Math.random() - 0.5) * 0.3,
                        speedY: (Math.random() - 0.5) * 0.3,
                        opacity: Math.random() * 0.5 + 0.2
                    });
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, width, height);
                for (let p of particlesArray) {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;
                    ctx.fillStyle = `rgba(255, 215, 0, ${p.opacity})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                requestAnimationFrame(animateParticles);
            }

            window.addEventListener('resize', initParticles);
            initParticles();
            animateParticles();

            // ──────────────────────────────────────
            // TYPING ANIMATION
            function typeText(element, text, speed, callback) {
                let i = 0;
                element.textContent = '';
                element.style.display = 'inline-block';
                function type() {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        i++;
                        setTimeout(type, speed + Math.random() * 40);
                    } else {
                        if (callback) setTimeout(callback, 300);
                    }
                }
                type();
            }

            // ──────────────────────────────────────
            // CAPTCHA GENERATOR
            function generateCaptcha() {
                const a = Math.floor(Math.random() * 10) + 1;
                const b = Math.floor(Math.random() * 10) + 1;
                captchaAnswer = a + b;
                captchaQuestion.textContent = `Captcha: What is ${a} + ${b}?`;
            }

            // ──────────────────────────────────────
            // SHOW / HIDE INPUTS
            function showGroup(group) {
                group.classList.add('active');
                const input = group.querySelector('input');
                if (input) input.focus();
            }

            function hideGroup(group) {
                group.classList.remove('active');
            }

            // ──────────────────────────────────────
            // MODAL HANDLING
            function showModal(type, title, message, callback) {
                modalBox.className = 'modal-box ' + (type === 'success' ? 'success' : 'denied');
                modalTitle.textContent = title;
                modalTitle.className = 'modal-title ' + (type === 'success' ? 'green' : 'red');
                modalMessage.textContent = message;
                modalOverlay.classList.add('active');

                modalClose.onclick = () => {
                    modalOverlay.classList.remove('active');
                    if (callback) callback();
                };

                // Auto-close success modal after 1.5 seconds
                if (type === 'success' && callback) {
                    setTimeout(() => {
                        modalOverlay.classList.remove('active');
                        callback();
                    }, 1500);
                }
            }

            function flashRedAlert() {
                const flash = document.createElement('div');
                flash.className = 'red-alert-flash';
                document.body.appendChild(flash);
                setTimeout(() => flash.remove(), 300);
            }

            // ──────────────────────────────────────
            // FORM SUBMISSION (placeholder for encryption)
            function handleSubmit() {
                const name = nameInput.value.trim();
                const code = codeInput.value.trim();
                const captchaVal = captchaInput.value.trim();

                if (!name || !code || !captchaVal) {
                    showModal('denied', 'INCOMPLETE', 'All fields are required.', () => {});
                    return;
                }

                // ──────────────────────────────────
                // ENCRYPTION LAYER PLACEHOLDER
                // In the future you will encrypt the code here
                // Example: const encryptedCode = yourEncryptionFunction(code);
                // For now we compare directly (plaintext)
                // ──────────────────────────────────
                const codeValid = (code === SECRET_CODE);
                const captchaValid = (parseInt(captchaVal) === captchaAnswer);

                if (!codeValid || !captchaValid) {
                    flashRedAlert();
                    showModal('denied', 'ACCESS DENIED', 'Secret code or captcha incorrect.', () => {
                        // Reset ALL inputs for a fresh attempt
                        nameInput.value = '';
                        codeInput.value = '';
                        captchaInput.value = '';
                        generateCaptcha();
                        // Reset to step 0 (start over)
                        step = 0;
                        hideGroup(captchaGroup);
                        hideGroup(codeGroup);
                        hideGroup(nameGroup);
                        submitBtn.classList.remove('active');
                        // Re-type initial prompt
                        typingText.textContent = '';
                        typeText(typingText, 'Enter your name:', 60, () => {
                            showGroup(nameGroup);
                            nameInput.focus();
                            step = 1;
                        });
                    });
                    return;
                }

                // Success
                userName = name;
                showModal('success', 'WELCOME, ' + userName.toUpperCase(), 'Access granted. Redirecting...', () => {
                    // Redirect to main.html (Django template)
                    window.location.href = "{% url 'main' %}"; // Django template tag
                    // Fallback for testing:
                    // window.location.href = "main.html";
                });
            }

            // ──────────────────────────────────────
            // PROGRESS THROUGH STEPS
            function progressToNextStep() {
                if (step === 0) {
                    // Just finished typing name prompt, show name input
                    showGroup(nameGroup);
                    submitBtn.classList.remove('active');
                    step = 1;
                } else if (step === 1) {
                    // Name entered, now type code prompt
                    hideGroup(nameGroup);
                    typingText.textContent = '';
                    typeText(typingText, 'Enter secret code:', 60, () => {
                        showGroup(codeGroup);
                        step = 2;
                    });
                } else if (step === 2) {
                    // Code entered, type captcha prompt
                    hideGroup(codeGroup);
                    generateCaptcha();
                    typingText.textContent = '';
                    typeText(typingText, 'Complete captcha verification:', 60, () => {
                        showGroup(captchaGroup);
                        step = 3;
                    });
                } else if (step === 3) {
                    // Captcha entered, enable submit
                    submitBtn.classList.add('active');
                    step = 4;
                }
            }

            // ──────────────────────────────────────
            // EVENT LISTENERS
            nameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && step === 1) {
                    e.preventDefault();
                    if (nameInput.value.trim() !== '') {
                        progressToNextStep();
                    }
                }
            });

            codeInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && step === 2) {
                    e.preventDefault();
                    if (codeInput.value.trim() !== '') {
                        progressToNextStep();
                    }
                }
            });

            captchaInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && step === 3) {
                    e.preventDefault();
                    if (captchaInput.value.trim() !== '') {
                        progressToNextStep();
                    }
                }
            });

            submitBtn.addEventListener('click', () => {
                if (step === 4) handleSubmit();
            });

            // ──────────────────────────────────────
            // START SEQUENCE
            function startSequence() {
                step = 0;
                hideGroup(nameGroup);
                hideGroup(codeGroup);
                hideGroup(captchaGroup);
                submitBtn.classList.remove('active');
                typingText.textContent = '';
                typeText(typingText, 'Enter your name:', 60, () => {
                    showGroup(nameGroup);
                    step = 1;
                });
            }

            startSequence();
        })();
    </script>
</body>
</html>
